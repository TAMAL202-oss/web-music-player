<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundify - Web Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav>
        <ul>
            <li class="brand"><img src="images.png" alt="Spotify"></li>
            <li>Home</li>
            <li>About</li>
        </ul>
    </nav>

    <div class="container">
        <div class="songList">
            <h1>Best of NCS & Bollywood</h1>
            <div class="songItemContainer">
                <div class="songItem">
                    <img src="1.jpg" alt="1">
                    <span class="songName">Salam-e-Ishq</span>
                    <span class="songlistplay"><span class="timestamp">05:34 <i id="0" class="fa-solid songItemPlay fa-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="1.jpg" alt="2">
                    <span class="songName">Tum Hi Ho</span>
                    <span class="songlistplay"><span class="timestamp">04:22 <i id="1" class="fa-solid songItemPlay fa-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="1.jpg" alt="3">
                    <span class="songName">Channa Mereya</span>
                    <span class="songlistplay"><span class="timestamp">04:49 <i id="2" class="fa-solid songItemPlay fa-play"></i></span></span>
                </div>
                <div class="songItem">
                    <img src="1.jpg" alt="4">
                    <span class="songName">Amake Amar Moto</span>
                    <span class="songlistplay"><span class="timestamp">04:38 <i id="3" class="fa-solid songItemPlay fa-play"></i></span></span>
                </div>
            </div>
        </div>
        <div class="songBanner"></div>
    </div>

    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100">
        <div class="icons">
            <i class="fa-solid fa-3x fa-step-backward" id="previous"></i>
            <i class="fa-solid fa-3x fa-play" id="masterPlay"></i>
            <i class="fa-solid fa-3x fa-step-forward" id="next"></i>
        </div>
        <div class="songInfo">
            <img src="download.gif" width="42px" alt="" id="gif"> <span id="masterSongName">Salam-e-Ishq</span>
        </div>
    </div>
    <script src="script.js?v=3"></script>
</body>
</html>
